[pytest]
testpaths = tests
markers =
    requires_ansys: requires a local ANSYS/MAPDL installation and should be excluded from quick tests
    requires_opensees: requires OpenSees/OpenSeesPy runtime and should be excluded from quick tests
    requires_sim_cli: requires the external sim-cli parser tools and should be excluded from quick tests
    slow: long-running test that is not part of the default fast smoke subset
    integration: crosses module/process boundaries or writes workflow artifacts
norecursedirs =
    .git
    .serena/cache
    .pytest_cache
    .pytest_local
    __pycache__
    node_modules
    output
    outputs
    results
    runs
    tests/_artifacts
    tests/_tmp
    tests_combin37_equiv
    skills-duplicate-backup-*
    momo_agent/frontend
    RandomTrafficLoadGeneration/outputs
