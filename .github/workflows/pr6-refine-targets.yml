name: PR6 Refine Comparison Targets

on:
  push:
    branches:
      - feat/cross-run-result-comparison

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-run-result-comparison
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply fail-closed target identity refinement
        run: python .github/pr6_refine_targets.py
      - name: Check syntax and whitespace
        run: |
          python -m compileall -q momo_agent/backend/app momo_agent/backend/tests
          git diff --check
      - name: Remove one-shot helpers
        run: |
          rm .github/pr6_refine_targets.py
          rm .github/workflows/pr6-refine-targets.yml
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve comparison target identity across candidates"
          git push origin HEAD:feat/cross-run-result-comparison
