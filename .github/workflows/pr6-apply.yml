name: PR6 Apply Cross-run Comparison

on:
  push:
    branches:
      - feat/cross-run-result-comparison

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cross-run-result-comparison
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Disambiguate duplicated harness catalog fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('momo_agent/backend/tests/test_agent_harness.py')
          text = path.read_text(encoding='utf-8')
          old = "        'result.compare',\n        'result.correlate',"
          new = "        'result.compare',\n        'result.compare_runs',\n        'result.correlate',"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two harness catalog fixtures, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply fail-closed PR6 integration
        run: python .github/pr6_apply.py
      - name: Check Python syntax and whitespace
        run: |
          python -m compileall -q momo_agent/backend/app momo_agent/backend/tests
          git diff --check
      - name: Remove one-shot helpers
        run: |
          rm .github/pr6_apply.py
          rm .github/workflows/pr6-apply.yml
      - name: Commit PR6 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate cross-run comparison into agent harness"
          git push origin HEAD:feat/cross-run-result-comparison
