name: PR5 Safety Refine Memory

on:
  push:
    branches: [feat/engineering-project-memory]
    paths:
      - scripts/pr5_safety_refine.py
      - .github/workflows/pr5-safety-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/engineering-project-memory
          fetch-depth: 0
      - name: Apply fail-closed refinements
        run: python scripts/pr5_safety_refine.py
      - name: Check syntax and whitespace
        run: |
          python -m compileall -q momo_agent/backend/app/services/agent_project_context.py
          git diff --check
      - name: Remove one-shot helpers
        run: |
          rm scripts/pr5_safety_refine.py
          rm .github/workflows/pr5-safety-refine.yml
      - name: Commit safety refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep project memory out of execution-only model gaps"
          git push origin HEAD:feat/engineering-project-memory
