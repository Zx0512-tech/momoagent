name: PR5 Multi-turn Memory Refine

on:
  push:
    branches: [feat/engineering-project-memory]
    paths:
      - scripts/pr5_multiturn_refine.py
      - .github/workflows/pr5-multiturn-refine.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/engineering-project-memory
          fetch-depth: 0
      - name: Apply fail-closed multi-turn fix
        run: python scripts/pr5_multiturn_refine.py
      - name: Check syntax and whitespace
        run: |
          python -m compileall -q momo_agent/backend/app/services/agent_project_context.py momo_agent/backend/app/services/agent_harness.py
          git diff --check
      - name: Remove one-shot helpers
        run: |
          rm scripts/pr5_multiturn_refine.py
          rm .github/workflows/pr5-multiturn-refine.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve prior explicit fields across memory clarification"
          git push origin HEAD:feat/engineering-project-memory
