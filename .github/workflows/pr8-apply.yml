name: PR8 one-shot migration

on:
  push:
    branches:
      - feat/engineering-capability-runtime
    paths:
      - .github/pr8_apply.py
      - .github/workflows/pr8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-opensees.txt
      - name: Repair staged helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/pr8_apply.py')
          text = path.read_text(encoding='utf-8')

          bad = "subprocess.run([\\n    'python', '-m', 'pytest', '-q',\\n    'tests/test_engineering_capability_runtime.py',\\n    'tests/test_agent_llm.py',\\n    'tests/test_agent_harness.py',\\n], cwd=BACKEND, check=True)"
          good = "subprocess.run(['python', '-m', 'pytest', '-q', 'tests/test_engineering_capability_runtime.py', 'tests/test_agent_llm.py', 'tests/test_agent_harness.py'], cwd=BACKEND, check=True)"
          if bad not in text:
              raise SystemExit('staged pytest syntax anchor missing')
          text = text.replace(bad, good, 1)

          text = text.replace(
              "if self.risk in {ToolRisk.SOLVER_EXECUTION, ToolRisk.MUTATING} and not self.requires_approval:",
              "if self.risk is ToolRisk.SOLVER_EXECUTION and not self.requires_approval:",
              1,
          )

          anchor = "write(test_llm, text)\n\n# Basic syntax/targeted tests before committing. Full repository CI runs after PR creation."
          if anchor not in text:
              raise SystemExit('test migration insertion anchor missing')
          migration = r'''old_payload_contract = """    final_payload = json.loads(payload['messages'][-1]['content'])
    assert list(final_payload) == ['workflowState', 'userContent', 'resultInquiryContext']
    assert final_payload['userContent'] == '分别给出所有统计量的峰值'
    assert final_payload['resultInquiryContext']['sourceRunId'] == 'agr_1'
"""
new_payload_contract = """    final_payload = json.loads(payload['messages'][-1]['content'])
    assert list(final_payload) == ['runtimeContext', 'userContent']
    runtime_context = final_payload['runtimeContext']
    assert final_payload['userContent'] == '分别给出所有统计量的峰值'
    assert runtime_context['resultInquiryContext']['sourceRunId'] == 'agr_1'
    assert runtime_context['scope'] == 'TURN_SNAPSHOT'
"""
if old_payload_contract not in text:
    raise RuntimeError('agent_llm final payload contract anchor missing')
text = text.replace(old_payload_contract, new_payload_contract, 1)
write(test_llm, text)

# Basic syntax/targeted tests before committing. Full repository CI runs after PR creation.'''
          text = text.replace(anchor, migration, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply and validate PR8
        run: python .github/pr8_apply.py
