name: PR8 one-shot migration

on:
  push:
    branches:
      - feat/engineering-capability-runtime
    paths:
      - .github/pr8_apply.py
      - .github/workflows/pr8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-opensees.txt
      - name: Repair staged helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/pr8_apply.py')
          text = path.read_text(encoding='utf-8')
          bad = "subprocess.run([\\n    'python', '-m', 'pytest', '-q',\\n    'tests/test_engineering_capability_runtime.py',\\n    'tests/test_agent_llm.py',\\n    'tests/test_agent_harness.py',\\n], cwd=BACKEND, check=True)"
          good = "subprocess.run(['python', '-m', 'pytest', '-q', 'tests/test_engineering_capability_runtime.py', 'tests/test_agent_llm.py', 'tests/test_agent_harness.py'], cwd=BACKEND, check=True)"
          if bad not in text:
              raise SystemExit('staged pytest syntax anchor missing')
          text = text.replace(bad, good, 1)
          text = text.replace("if self.risk in {ToolRisk.SOLVER_EXECUTION, ToolRisk.MUTATING} and not self.requires_approval:", "if self.risk is ToolRisk.SOLVER_EXECUTION and not self.requires_approval:", 1)
          text = text.replace('必须结合完整语义历史理解多轮补充', '必须结合完整对话历史理解多轮补充', 1)
          anchor = "write(test_llm, text)\n\n# Basic syntax/targeted tests before committing. Full repository CI runs after PR creation."
          old_lines = ["    final_payload = json.loads(payload['messages'][-1]['content'])", "    assert list(final_payload) == ['workflowState', 'userContent', 'resultInquiryContext']", "    assert final_payload['userContent'] == '分别给出所有统计量的峰值'", "    assert final_payload['resultInquiryContext']['sourceRunId'] == 'agr_1'"]
          new_lines = ["    final_payload = json.loads(payload['messages'][-1]['content'])", "    assert list(final_payload) == ['runtimeContext', 'userContent']", "    runtime_context = final_payload['runtimeContext']", "    assert final_payload['userContent'] == '分别给出所有统计量的峰值'", "    assert runtime_context['resultInquiryContext']['sourceRunId'] == 'agr_1'", "    assert runtime_context['scope'] == 'TURN_SNAPSHOT'"]
          patch_code = "old_payload_contract = " + repr(chr(10).join(old_lines) + chr(10)) + chr(10) + "new_payload_contract = " + repr(chr(10).join(new_lines) + chr(10)) + chr(10) + "if old_payload_contract not in text:\n    raise RuntimeError('agent_llm final payload contract anchor missing')\ntext = text.replace(old_payload_contract, new_payload_contract, 1)\nwrite(test_llm, text)\n\ntest_harness = TESTS / 'test_agent_harness.py'\nharness_test_text = read(test_harness)\nold_harness_assert = \"    assert repository.messages[0]['harnessContent'].startswith('{\\\"workflowState\\\"')\"\nnew_harness_assert = \"    assert repository.messages[0]['harnessContent'].startswith('{\\\"runtimeContext\\\"')\"\nif old_harness_assert not in harness_test_text:\n    raise RuntimeError('harnessContent contract anchor missing')\nharness_test_text = harness_test_text.replace(old_harness_assert, new_harness_assert, 1)\nwrite(test_harness, harness_test_text)\n\n# Basic syntax/targeted tests before committing. Full repository CI runs after PR creation."
          if anchor not in text:
              raise SystemExit('test migration insertion anchor missing')
          text = text.replace(anchor, patch_code, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile .github/pr8_apply.py
      - name: Apply and validate PR8
        run: python .github/pr8_apply.py
