name: PR9 legacy capability scan

on:
  push:
    branches:
      - feat/capability-runtime-completion

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan harness capability surfaces
        shell: bash
        run: |
          set -euo pipefail
          FILE=momo_agent/backend/app/services/agent_harness.py
          echo '=== legacy specs ==='
          grep -n -C 2 '_HARNESS_TOOL_SPECS\|_MODEL_INVOCABLE_TOOLS\|harness_tool_catalog' "$FILE" || true
          echo '=== dispatcher ==='
          grep -n -C 3 'authorize_and_validate' "$FILE" || true
          echo '=== model argument validation ==='
          grep -n -C 3 'model_validate(call.arguments)' "$FILE" || true
          echo '=== workflow guard ==='
          grep -n -C 2 'WorkflowGuard().authorize' "$FILE" || true
          echo '=== step catalog calls ==='
          grep -n -C 2 'harness_step_tool_catalog' "$FILE" || true
