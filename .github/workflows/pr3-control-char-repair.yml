name: PR3 Control Character Repair

on:
  push:
    branches:
      - refactor/unify-optimization-execution

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-optimization-execution
          fetch-depth: 0
      - name: Repair damaged harness test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('momo_agent/backend/tests/test_agent_harness.py')
          text = path.read_text(encoding='utf-8')
          if text.count('\x01') != 1 or text.count('\x02') != 1:
              raise SystemExit(f'unexpected control chars: U+0001={text.count(chr(1))}, U+0002={text.count(chr(2))}')

          prefix = """def test_harness_rejects_solver_rewrite_and_repairs_to_opensees_optimization(monkeypatch) -> None:
              service = AgentService()
              repository = _Repository()
              monkeypatch.setenv('MOMO_AGENT_RUNTIME', 'WORKFLOW_HARNESS')
              monkeypatch.setattr(service, 'repository', lambda: repository)
              calls: list[dict] = []

              def run_harness_turn(**kwargs):
                  calls.append(kwargs)
                  if len(calls) == 1:
          """
          text = text.replace('\x01', prefix)
          text = text.replace('\x02', '\n        else:')
          if '\x01' in text or '\x02' in text:
              raise SystemExit('control characters remain after repair')
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/pr3-control-char-repair.yml')
          workflow.unlink()
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add momo_agent/backend/tests/test_agent_harness.py .github/workflows/pr3-control-char-repair.yml
          git diff --cached --check
          git commit -m 'test: repair harness canonical optimization fixture'
          git push origin HEAD:refactor/unify-optimization-execution