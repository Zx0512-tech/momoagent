name: PR3 CI Cleanup

on:
  push:
    branches:
      - refactor/unify-optimization-execution

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[pr3-ci-cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-optimization-execution
          fetch-depth: 0
      - name: Apply guarded CI fixes
        run: python tools/pr3_ci_cleanup.py
      - name: Commit CI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align PR3 regressions with canonical optimization [pr3-ci-cleaned]"
          git push origin HEAD:refactor/unify-optimization-execution
