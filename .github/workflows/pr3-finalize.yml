name: PR3 Finalize

on:
  push:
    branches:
      - refactor/unify-optimization-execution

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[pr3-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-optimization-execution
          fetch-depth: 0
      - name: Apply guarded fixes
        run: python tools/pr3_finalize.py
      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize unified optimization execution [pr3-finalized]"
          git push origin HEAD:refactor/unify-optimization-execution
