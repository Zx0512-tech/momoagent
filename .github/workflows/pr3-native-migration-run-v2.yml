name: PR3 Native Migration Run V2

on:
  push:
    branches: [refactor/unify-optimization-execution]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-optimization-execution
          fetch-depth: 0
      - name: Refine and apply migration
        run: |
          python tools/pr3_prepare_migration.py
          python tools/pr3_native_migration.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: retire internal full optimization task [pr3-native-migrated]"
          git push origin HEAD:refactor/unify-optimization-execution
