name: PR3 Last CI Fix

on:
  push:
    branches:
      - refactor/unify-optimization-execution

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pr3-last-ci-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unify-optimization-execution
          fetch-depth: 0
      - name: Apply guarded fixes
        run: python tools/pr3_last_ci_fix.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: finish canonical optimization regressions [pr3-last-ci-fixed]"
          git push origin HEAD:refactor/unify-optimization-execution
