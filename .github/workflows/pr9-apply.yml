name: PR9 capability runtime completion

on:
  push:
    branches:
      - feat/capability-runtime-completion

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-opensees.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-opensees.txt && python -m pip install ruff==0.16.4
      - name: Apply deterministic PR9 migration
        run: |
          python scripts/pr9_fix_apply.py
          python scripts/pr9_fix_import.py
          python scripts/pr9_apply.py
      - name: Compile backend
        run: python -m compileall -q momo_agent/backend/app momo_agent/backend/tests
      - name: Ruff correctness
        run: python -m ruff check momo_agent/backend/app momo_agent/backend/tests --select E9,F63,F7,F82
      - name: Verify legacy surfaces are gone
        shell: bash
        run: |
          set -euo pipefail
          FILE=momo_agent/backend/app/services/agent_harness.py
          ! grep -n '_HARNESS_TOOL_SPECS\|HarnessToolSpec\|_MODEL_INVOCABLE_TOOLS\|_CAPABILITY_POLICY_OVERRIDES\|def harness_tool_catalog\|TypedToolRegistry\|TypedAgentTool' "$FILE"
          grep -n 'CapabilityDispatcher' "$FILE"
          grep -n 'harness_step_tool_catalog' "$FILE"
      - name: Focused capability and harness tests
        working-directory: momo_agent/backend
        run: python -m pytest tests/test_engineering_capability_runtime.py tests/test_agent_harness.py tests/test_agent_llm.py -q
      - name: Whitespace check
        run: git diff --check
      - name: Commit product changes and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr9-scan.yml .github/workflows/pr9-apply.yml scripts/pr9_apply.py scripts/pr9_fix_apply.py scripts/pr9_fix_import.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: complete engineering capability runtime migration'
          git push origin HEAD:feat/capability-runtime-completion
