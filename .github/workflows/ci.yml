name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast-tests:
    name: Backend fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-opensees.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-opensees.txt

      - name: Run backend fast regression suite
        working-directory: momo_agent/backend
        run: python -m pytest tests -m "not requires_ansys and not requires_opensees and not slow" --maxfail=1 -q

  frontend-quality:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: platform-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run check:bundle

  profile-contract-smoke:
    name: Optimization profile contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-opensees.txt

      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-opensees.txt

      - name: Run optimization profile tests
        working-directory: momo_agent/backend
        run: python -m pytest tests/test_optimization_profiles.py -q
