name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast-tests:
    name: Backend fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-opensees.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-opensees.txt

      - name: Run backend fast regression suite
        working-directory: momo_agent/backend
        # Legacy tests below cross a real solver/preflight boundary but are not yet classified
        # with requires_ansys/requires_opensees. Keep production evidence gates strict and
        # exclude only those environment-dependent cases from the hosted Linux fast lane.
        run: >-
          python -m pytest tests
          -m "not requires_ansys and not requires_opensees and not requires_both_solvers and not slow"
          --deselect tests/test_agent_load_api.py::test_analysis_freezes_real_solver_job_after_load_mapping
          --deselect tests/test_agent_load_api.py::test_analysis_without_upload_freezes_bundled_earthquake_artifact
          --deselect tests/test_damper_sweep_wind.py::test_wind_sweep_freezes_registered_wind_template_and_target_set
          --deselect tests/test_damper_sweep_wind.py::test_earthquake_sweep_keeps_no_target_set_and_earthquake_template
          -q

  frontend-quality:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: platform-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run check:bundle
