name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-fast-tests:
    name: Backend fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-opensees.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-opensees.txt && python -m pip install ruff==0.16.4

      - name: Lint Python correctness hazards
        run: python -m ruff check momo_agent/backend/app momo_agent/backend/tests --select E9,F63,F7,F82

      - name: Check changed-file whitespace
        run: git diff --check HEAD^ HEAD

      - name: Run backend fast regression suite
        working-directory: momo_agent/backend
        run: >-
          python -m pytest tests
          -m "not requires_ansys and not requires_opensees and not requires_both_solvers and not slow"
          -q

  frontend-quality:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: platform-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run check:bundle
