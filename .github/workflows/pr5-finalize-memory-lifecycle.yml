name: PR5 Finalize Memory Lifecycle

on:
  push:
    branches: [feat/engineering-project-memory]
    paths:
      - tools/pr5_finalize_memory_lifecycle.py
      - .github/workflows/pr5-finalize-memory-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fail-closed lifecycle patch
        run: python tools/pr5_finalize_memory_lifecycle.py
      - name: Syntax and whitespace checks
        run: |
          python -m py_compile momo_agent/backend/app/services/agent_service.py
          git diff --check
      - name: Remove one-shot helpers
        run: rm tools/pr5_finalize_memory_lifecycle.py .github/workflows/pr5-finalize-memory-lifecycle.yml
      - name: Commit lifecycle fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: materialize project memory only at run finalization"
          git push origin HEAD:feat/engineering-project-memory
