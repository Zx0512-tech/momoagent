   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start; fill: #0f4d92" x="43.6356" y="38.382662" transform="rotate(-0 43.6356 38.382662)">MOMO 工程智能体：从意图理解到证据回复的闭环逻辑</text>
