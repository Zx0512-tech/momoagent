[pytest]
norecursedirs = pytest-cache-files-* .pytest_cache .pytest-tmp-check
pythonpath = ../..
markers =
    requires_ansys: requires a local ANSYS/MAPDL installation or ANSYS template preflight
    requires_opensees: requires OpenSees/OpenSeesPy runtime and should be excluded from hosted fast tests
    requires_both_solvers: requires both ANSYS and OpenSees runtimes
    requires_sim_cli: requires the external sim-cli parser tools
    slow: long-running test that is not part of the hosted fast regression lane
    integration: crosses module/process boundaries or writes workflow artifacts
